# YOLOv8 云南烤烟病害检测训练配置

# 数据集配置
data: data/dataset.yaml

# 训练参数
epochs: 60
patience: 15  # 早停策略
batch: 16
imgsz: 640
save: True

# 优化器参数
optimizer: SGD
lr0: 0.01
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# 损失函数权重
box: 0.05
cls: 0.5
dfl: 1.5

# 数据增强
hsv_h: 0.015  # HSV色调增强
hsv_s: 0.7    # HSV饱和度增强
hsv_v: 0.4    # HSV亮度增强
degrees: 30.0  # 旋转角度
translate: 0.1  # 平移
scale: 0.5     # 缩放
shear: 0.0     # 剪切
perspective: 0.0  # 透视
flipud: 0.0    # 上下翻转
fliplr: 0.5    # 左右翻转
mosaic: 1.0    # 马赛克增强
mixup: 0.0     # 混合增强
copy_paste: 0.0  # 复制粘贴

# 云南特色增强
augment: True
blur: 0.1      # 模糊(模拟雾气)

# 设备配置
device: 0      # GPU ID
workers: 8     # 数据加载线程
project: runs/tobacco
name: exp      # 实验名称
exist_ok: False  # 是否覆盖现有实验