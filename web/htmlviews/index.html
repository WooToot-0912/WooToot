<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - 旅游项目管理系统</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../fonts/fontawesome-free-6.4.0-web/css/all.min.css">
  <link rel="stylesheet" href="../css/edit-project.css">
</head>
<body>
<nav class="sidebar">
  <!-- 导航栏代码保持不变 -->
</nav>

<div class="main-content">
  <div class="container">
    <div class="page-header">
      <div class="header-wrapper">
        <h2><i class="fa fa-edit"></i> 旅游项目管理系统</h2>
        <p class="subtitle">欢迎回来，<span id="username">管理员</span></p>

      </div>
      <div class="quick-stats">
        <div class="stat-item">
          <i class="fa fa-check-circle"></i>
          <div class="stat-info">
            <span class="stat-value">4</span>
            <span class="stat-label">已完成</span>
          </div>
        </div>
        <div class="stat-item">
          <i class="fa fa-spinner"></i>
          <div class="stat-info">
            <span class="stat-value">3</span>
            <span class="stat-label">进行中</span>
          </div>
        </div>
        <div class="stat-item">
          <i class="fa fa-clock"></i>
          <div class="stat-info">
            <span class="stat-value">4</span>
            <span class="stat-label">计划中</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 搜索条件区域 -->
    <div class="search-area">
      <div class="search-header">
        <h3><i class="fa fa-search"></i> 搜索条件</h3>
        <button class="btn-add">
          <i class="fa fa-plus"></i> 新建项目
        </button>
      </div>
      <div class="search-content">
        <div class="search-row">
          <div class="search-item">
            <label><i class="fa fa-hashtag"></i> 项目名称</label>
            <input type="text" placeholder="请输入项目名称" class="form-control">
          </div>
          <div class="search-item">
            <label><i class="fa fa-tag"></i> 项目状态</label>
            <select class="form-control">
              <option value="">全部</option>
              <option value="已完成">已完成</option>
              <option value="进行中">进行中</option>
              <option value="计划中">计划中</option>
            </select>
          </div>
          <div class="search-item">
            <label><i class="fa fa-calendar"></i> 年份</label>
            <select class="form-control">
              <option value="">全部</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
            </select>
          </div>
        </div>
        <div class="search-row">
          <div class="search-item">
            <label><i class="fa fa-map-marker"></i> 地点</label>
            <input type="text" placeholder="请输入地点" class="form-control">
          </div>
          <div class="search-actions">
            <button class="btn-search">
              <i class="fa fa-search"></i> 查询
            </button>
            <button class="btn-reset">
              <i class="fa fa-refresh"></i> 重置
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 项目列表 -->
    <div class="project-list">
      <div class="list-header">
        <h3><i class="fa fa-list"></i> 项目列表</h3>
        <div class="list-actions">
          <button class="btn-export">
            <i class="fa fa-download"></i> 导出
          </button>
          <button class="btn-batch">
            <i class="fa fa-cog"></i> 批量操作
          </button>
        </div>
      </div>
      <div class="table-responsive">
        <table>
          <thead>
          <tr>
            <th><input type="checkbox" class="select-all"></th>
            <th>项目ID</th>
            <th>项目名称</th>
            <th>年份</th>
            <th>地点</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>备注</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td><input type="checkbox" class="select-item"></td>
            <td>1</td>
            <td class="project-name">
              <i class="fa fa-bookmark"></i>
              <span>探索埃及金字塔</span>
            </td>
            <td>2024</td>
            <td><i class="fa fa-map-marker"></i> 中国</td>
            <td>2024-12-01</td>
            <td>2024-01-01</td>
            <td class="project-notes">探索古埃及文明</td>
            <td><span class="status-badge status-completed">已完成</span></td>
            <td class="action-buttons">
              <a href="#" class="btn-action" title="查看详情">
                <i class="fa fa-eye"></i>
              </a>
              <a href="#" class="btn-action" title="编辑">
                <i class="fa fa-pencil"></i>
              </a>
              <a href="#" class="btn-action" title="删除">
                <i class="fa fa-trash"></i>
              </a>
            </td>
          </tr>
          <!-- 更多项目行将通过JSP动态生成 -->
          </tbody>
        </table>
      </div>

      <!-- 分页 -->
      <div class="pagination">
        <span class="page-info">共 11 条记录</span>
        <div class="page-buttons">
          <a href="#" class="btn-page" title="首页">
            <i class="fa fa-angle-double-left"></i>
          </a>
          <a href="#" class="btn-page" title="上一页">
            <i class="fa fa-angle-left"></i>
          </a>
          <a href="#" class="btn-page active">1</a>
          <a href="#" class="btn-page">2</a>
          <span class="page-ellipsis">...</span>
          <a href="#" class="btn-page" title="下一页">
            <i class="fa fa-angle-right"></i>
          </a>
          <a href="#" class="btn-page" title="末页">
            <i class="fa fa-angle-double-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
