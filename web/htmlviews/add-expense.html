<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>添加消费记录</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../fonts/fontawesome-free-6.4.0-web/css/all.min.css">
  <link rel="stylesheet" href="../css/add-expense.css">
</head>
<body>
<nav class="sidebar">
  <!-- 导航栏代码保持不变 -->
</nav>

<div class="main-content">
  <div class="container">
    <div class="page-header">
      <h2><i class="fa fa-plus-circle"></i> 添加消费记录</h2>
      <p class="subtitle">请填写以下信息以添加新的消费记录</p>
    </div>

    <form action="addExpense" method="post" class="expense-form">
      <div class="form-row">
        <div class="form-group">
          <label for="expensetype">
            <i class="fa fa-tag"></i> 消费类型
          </label>
          <select id="expensetype" name="expensetype" class="form-control">
            <option value="">请选择消费类型</option>
            <option value="交通">交通</option>
            <option value="住宿">住宿</option>
            <option value="餐饮">餐饮</option>
            <option value="门票">门票</option>
            <option value="门票">购物</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="price">
            <i class="fa fa-money"></i> 金额
          </label>
          <div class="price-input">
            <span class="currency">¥</span>
            <input type="number" id="price" name="price" step="0.01" required
                   placeholder="请输入金额" class="form-control">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="description">
          <i class="fa fa-file-text"></i> 描述
        </label>
        <textarea id="description" name="description" required
                  placeholder="请输入消费描述" class="form-control"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="expensetime">
            <i class="fa fa-calendar"></i> 消费时间
          </label>
          <input type="datetime-local" id="expensetime" name="expensetime"
                 required class="form-control">
        </div>

        <div class="form-group">
          <label for="involvedpersons">
            <i class="fa fa-users"></i> 涉及人员
          </label>
          <input type="text" id="involvedpersons" name="involvedpersons"
                 required placeholder="请输入涉及人员，用逗号分隔" class="form-control">
        </div>
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn-submit">
          <i class="fa fa-check"></i> 保存记录
        </button>
        <button type="button" class="btn-cancel">
          <i class="fa fa-times"></i> 取消
        </button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
